<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>图片风格化转绘工坊</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    width: 100%;
    max-width: 650px;
    background: #1e1e1e;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  h2 { font-size: 20px; color: #e0e0e0; margin: 0; }

  /* AI 状态标签 */
  .ai-status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    background: #333;
    color: #aaa;
    transition: all 0.3s;
    border: 1px solid #444;
  }
  .ai-status.loading {
    background: #4a3b1a; color: #f0ad4e; border-color: #f0ad4e;
    animation: pulse 1.5s infinite;
  }
  .ai-status.ready {
    background: #143d24; color: #10b981; border-color: #10b981;
  }
  @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

  /* 棋盘格背景 */
  .canvas-container {
    width: 100%;
    height: 350px;
    background-color: #2a2a2a;
    background-image: 
      linear-gradient(45deg, #333 25%, transparent 25%), 
      linear-gradient(-45deg, #333 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #333 75%), 
      linear-gradient(-45deg, transparent 75%, #333 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    border: 2px dashed #444;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin-bottom: 20px;
    position: relative;
    cursor: pointer;
  }
  .canvas-container canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: none;
  }
  .placeholder-text {
    color: #888;
    font-size: 15px;
    position: absolute;
    pointer-events: none;
    text-align: center;
    text-shadow: 1px 1px 2px #000;
  }

  /* 滤镜选择区 */
  .filters {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 20px;
    scrollbar-width: thin;
  }
  .filters::-webkit-scrollbar { height: 6px; }
  .filters::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

  .filter-btn {
    background: #333;
    border: 1px solid #444;
    color: #ccc;
    padding: 8px 16px;
    border-radius: 20px;
    white-space: nowrap;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
    position: relative;
  }
  .filter-btn:active { transform: scale(0.92); }
  .filter-btn.active {
    background: #3b82f6;
    color: #fff;
    border-color: #3b82f6;
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
  }
  .filter-btn.special {
    background: #8b5cf6;
    border-color: #8b5cf6;
    color: #fff;
  }

  /* 操作按钮区 */
  .actions { display: flex; gap: 12px; }
  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    user-select: none;
  }
  .btn:active:not(:disabled) { transform: scale(0.96); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-upload { background: #4b5563; color: #fff; }
  .btn-copy { background: #10b981; color: #fff; }

  .file-input { display: none; }

  /* 遮罩与提示 */
  .loading-mask {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center;
    z-index: 10; color: #fff; font-size: 14px; flex-direction: column; gap: 10px;
    border-radius: 12px; backdrop-filter: blur(2px); text-align: center; padding: 20px;
  }
  .spinner {
    width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.2);
    border-radius: 50%; border-top-color: #3b82f6; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 12px 24px;
    border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity 0.3s; z-index: 100; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="container">
  <div class="header-row">
    <h2>🎨 图片风格化转绘</h2>
    <div class="ai-status" id="aiStatus">🟡 AI 模型未加载</div>
  </div>

  <div class="canvas-container" id="dropZone">
    <span class="placeholder-text" id="placeholder">点击此处导入图片<br><span style="font-size:12px;">(导入后在下方选择风格)</span></span>
    <canvas id="mainCanvas"></canvas>
    <div class="loading-mask" id="loadingMask">
      <div class="spinner"></div>
      <span id="loadingText">正在重绘中...</span>
    </div>
  </div>

  <div class="filters" id="filterList">
    <button class="filter-btn active" data-filter="none">原图</button>
    <button class="filter-btn special" data-filter="removebg">✨ 智能抠图</button>
    <button class="filter-btn" data-filter="oil">古典油画</button>
    <button class="filter-btn" data-filter="lineart">动画线稿</button>
    <button class="filter-btn" data-filter="sharpen">锐化增强</button>
    <button class="filter-btn" data-filter="emboss">浮雕艺术</button>
    <button class="filter-btn" data-filter="cel">赛璐璐</button>
    <button class="filter-btn" data-filter="anime">二次元</button>
    <button class="filter-btn" data-filter="ink">水墨国风</button>
    <button class="filter-btn" data-filter="ukiyoe">浮世绘</button>
    <button class="filter-btn" data-filter="sketch">铅笔素描</button>
    <button class="filter-btn" data-filter="comic">美漫波普</button>
  </div>

  <div class="actions">
    <input type="file" id="fileInput" class="file-input" accept="image/*">
    <button class="btn btn-upload" id="uploadBtn">选择图片</button>
    <button class="btn btn-copy" id="copyBtn" disabled>复制图片</button>
  </div>
</div>

<div class="toast" id="toast">提示信息</div>

<!-- 引入 AI 抠图库 -->
<script type="module">
  import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";
  window.imglyRemoveBackground = removeBackground;
</script>

<script>
  const canvas = document.getElementById('mainCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const placeholder = document.getElementById('placeholder');
  const fileInput = document.getElementById('fileInput');
  const copyBtn = document.getElementById('copyBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const dropZone = document.getElementById('dropZone');
  const filterList = document.getElementById('filterList');
  const toast = document.getElementById('toast');
  const loadingMask = document.getElementById('loadingMask');
  const loadingText = document.getElementById('loadingText');
  const aiStatus = document.getElementById('aiStatus');

  let originalImage = new Image();
  let currentFilter = 'none';
  let isProcessing = false;

  // 导入图片事件
  dropZone.addEventListener('click', () => fileInput.click());
  uploadBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => { originalImage.src = event.target.result; };
    reader.readAsDataURL(file);
    fileInput.value = ''; 
  });

  originalImage.onload = () => {
    placeholder.style.display = 'none';
    canvas.style.display = 'block';
    copyBtn.disabled = false;

    const MAX_WIDTH = 600; 
    let width = originalImage.width;
    let height = originalImage.height;
    if (width > MAX_WIDTH) {
      height = Math.round(height * (MAX_WIDTH / width));
      width = MAX_WIDTH;
    }
    canvas.width = width;
    canvas.height = height;
    applyFilter(currentFilter);
  };

  filterList.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    if (isProcessing) { showToast("正在处理，请稍候"); return; }
    if (!originalImage.src) { showToast("请先导入图片"); return; }

    const filterType = btn.dataset.filter;
    if (filterType === currentFilter) return;
    applyFilter(filterType);
  });

  // 核心调度器
  function applyFilter(filterType) {
    if (!originalImage.src || isProcessing) return;

    // 如果是 AI 抠图
    if (filterType === 'removebg') {
        runAIBackgroundRemoval();
        return;
    }

    isProcessing = true;
    loadingMask.style.display = 'flex';
    loadingText.innerText = '正在重绘中...';

    setTimeout(() => {
      setTimeout(() => {
        try {
          ctx.filter = 'none';
          ctx.globalCompositeOperation = 'source-over';
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
          currentFilter = filterType;

          document.querySelectorAll('.filter-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.filter === filterType);
          });

          if (filterType !== 'none') {
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            switch (filterType) {
              case 'oil': applyOilPaint(imageData); break;
              case 'lineart': applyLineArt(imageData); break;
              case 'sharpen': applyConvolution(imageData, [0, -1, 0, -1, 5, -1, 0, -1, 0]); break; 
              case 'emboss': applyConvolution(imageData, [1, 1, 1, 1, 0.7, -1, -1, -1, -1]); break; 
              case 'sketch': applySketch(imageData); break;
              case 'comic': applyComic(imageData); break;
              case 'cel': applyCelShading(imageData); break;
              case 'anime': applyAnime(imageData); break;
              case 'ink': applyInkWash(imageData); break;
              case 'ukiyoe': applyUkiyoe(imageData); break;
            }
          }
        } catch (error) {
          console.error(error);
          showToast("处理失败，请换一张图试试");
        } finally {
          loadingMask.style.display = 'none';
          isProcessing = false;
        }
      }, 50); 
    }, 20); 
  }

  // ========== 核心：AI 智能抠图（带进度提示与降级保护） ==========
  async function runAIBackgroundRemoval() {
    isProcessing = true;
    loadingMask.style.display = 'flex';

    // 如果模型已经就绪，直接提示正在抠图
    if (aiStatus.classList.contains('ready')) {
        loadingText.innerHTML = '正在提取人物主体...';
    } else {
        loadingText.innerHTML = '首次运行，正在下载 AI 模型...<br><span id="dlProgress" style="font-size:12px;color:#aaa">准备下载...</span>';
    }

    try {
        if (!window.imglyRemoveBackground) {
            throw new Error("CDN 模块加载失败，请刷新重试");
        }

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const imageUrl = URL.createObjectURL(blob);

        // 配置模型的下载进度回调
        const config = {
            progress: (key, current, total) => {
                const progressEl = document.getElementById('dlProgress');
                if (progressEl && total > 0) {
                    const percent = Math.round((current / total) * 100);
                    progressEl.innerText = `正在下载模型文件: ${key} (${percent}%)`;
                }
            }
        };

        // 调用 AI 模型
        const resultBlob = await window.imglyRemoveBackground(imageUrl, config);
        const resultUrl = URL.createObjectURL(resultBlob);

        const img = new Image();
        img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            currentFilter = 'removebg';
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.filter === 'removebg');
            });

            // 更新顶部状态标签为绿色就绪
            aiStatus.className = 'ai-status ready';
            aiStatus.innerText = '🟢 AI 模型已就绪';

            loadingMask.style.display = 'none';
            isProcessing = false;
            showToast("✅ AI 抠图完成！");
        };
        img.src = resultUrl;

    } catch (error) {
        console.error("AI 抠图失败，降级本地:", error);
        showToast("网络受限，已切换至本地抠图");

        // 更新顶部状态为黄色（失败状态）
        aiStatus.className = 'ai-status loading';
        aiStatus.innerText = '🟡 降级：本地抠图';

        // 降级方案：使用原有的本地泛洪抠图算法
        setTimeout(() => {
            try {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
                let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                applyAdvancedRemoveBg(imageData);

                currentFilter = 'removebg';
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.toggle('active', b.dataset.filter === 'removebg');
                });
            } catch (e) {
                console.error("本地抠图也失败:", e);
            } finally {
                loadingMask.style.display = 'none';
                isProcessing = false;
            }
        }, 100);
    }
  }

  // --- 本地滤镜算法库 ---

  function applyConvolution(imgData, matrix) {
    const data = imgData.data;
    const w = canvas.width, h = canvas.height;
    const output = new Uint8ClampedArray(data.length);
    for (let i = 0; i < data.length; i++) output[i] = data[i];
    const side = Math.round(Math.sqrt(matrix.length));
    const halfSide = Math.floor(side / 2);
    let alpha = 0;
    for(let i = 0; i < matrix.length; i++) alpha += matrix[i];
    if (alpha === 0) alpha = 1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const dstOff = (y * w + x) * 4;
        let r = 0, g = 0, b = 0;
        for (let cy = 0; cy < side; cy++) {
          for (let cx = 0; cx < side; cx++) {
            const scy = y + cy - halfSide;
            const scx = x + cx - halfSide;
            if (scy >= 0 && scy < h && scx >= 0 && scx < w) {
              const srcOff = (scy * w + scx) * 4;
              const wt = matrix[cy * side + cx];
              r += data[srcOff] * wt; g += data[srcOff + 1] * wt; b += data[srcOff + 2] * wt;
            }
          }
        }
        output[dstOff] = r / alpha; output[dstOff + 1] = g / alpha; output[dstOff + 2] = b / alpha; output[dstOff + 3] = 255;
      }
    }
    for (let i = 0; i < output.length; i++) data[i] = output[i];
    ctx.putImageData(imgData, 0, 0);
  }

  function applyAdvancedRemoveBg(imgData) {
    const data = imgData.data;
    const w = canvas.width, h = canvas.height;
    const gray = new Uint8ClampedArray(w * h);
    for (let i = 0; i < data.length; i += 4) gray[i / 4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
    const edges = new Uint8Array(w * h);
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        const gx = -1 * gray[idx - w - 1] + 1 * gray[idx - w + 1] + -2 * gray[idx - 1] + 2 * gray[idx + 1] + -1 * gray[idx + w - 1] + 1 * gray[idx + w + 1];
        const gy = -1 * gray[idx - w - 1] - 2 * gray[idx - w] - 1 * gray[idx - w + 1] + 1 * gray[idx + w - 1] + 2 * gray[idx + w] + 1 * gray[idx + w + 1];
        if (Math.sqrt(gx * gx + gy * gy) > 45) edges[idx] = 1;
      }
    }
    const expandedEdges = new Uint8Array(w * h);
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        if (edges[idx] || edges[idx-1] || edges[idx+1] || edges[idx-w] || edges[idx+w]) expandedEdges[idx] = 1;
      }
    }
    const mask = new Uint8Array(w * h);
    const queue = [];
    for (let x = 0; x < w; x++) { queue.push(x); queue.push((h - 1) * w + x); }
    for (let y = 0; y < h; y++) { queue.push(y * w); queue.push(y * w + w - 1); }
    while (queue.length > 0) {
      const idx = queue.shift();
      if (mask[idx] !== 0) continue; 
      mask[idx] = 1; 
      const x = idx % w, y = Math.floor(idx / w);
      if (x > 0 && expandedEdges[idx - 1] !== 1 && mask[idx - 1] === 0) queue.push(idx - 1);
      if (x < w - 1 && expandedEdges[idx + 1] !== 1 && mask[idx + 1] === 0) queue.push(idx + 1);
      if (y > 0 && expandedEdges[idx - w] !== 1 && mask[idx - w] === 0) queue.push(idx - w);
      if (y < h - 1 && expandedEdges[idx + w] !== 1 && mask[idx + w] === 0) queue.push(idx + w);
    }
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x, pIdx = idx * 4;
        if (mask[idx] === 0) data[pIdx+3] = 255; 
        else data[pIdx+3] = 0;   
      }
    }
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x, pIdx = idx * 4;
        if (data[pIdx+3] === 255) {
          let t = 0;
          if (data[(idx-1)*4+3] === 0) t++; if (data[(idx+1)*4+3] === 0) t++;
          if (data[(idx-w)*4+3] === 0) t++; if (data[(idx+w)*4+3] === 0) t++;
          if (t > 0) data[pIdx+3] = 150; 
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function applyLineArt(imgData) {
    const data = imgData.data, w = canvas.width, h = canvas.height;
    const gray = new Uint8ClampedArray(data.length / 4);
    for (let i = 0; i < data.length; i += 4) gray[i / 4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
    const blurred = new Uint8ClampedArray(gray.length);
    const kernel = [1/16, 2/16, 1/16, 2/16, 4/16, 2/16, 1/16, 2/16, 1/16];
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        let sum = 0, kIdx = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) sum += gray[(y + dy) * w + (x + dx)] * kernel[kIdx++];
        blurred[y * w + x] = sum;
      }
    }
    for (let i = 0; i < gray.length; i++) {
      let base = gray[i], blend = blurred[i], result = base;
      if (base > 220 && blend > 220) result = 255; 
      else if (blend < 255) {
        result = Math.min(255, (base * 255) / (255 - blend));
        result = Math.min(240, Math.max(0, (result - 128) * 1.5 + 128));
      }
      const p = i * 4; data[p] = result; data[p+1] = result; data[p+2] = result; data[p+3] = 255;
    }
    ctx.putImageData(imgData, 0, 0);
  }

  // ========== Kuwahara 油画滤镜（移植自 Python 实现） ==========
  function applyOilPaint(imgData) {
    const data = imgData.data;
    const w = canvas.width, h = canvas.height;
    const output = new Uint8ClampedArray(data.length);

    // radius 对应 Python 里的 a：(2a+1) 为窗口边长
    // 原代码 a=6 → 13x13 窗口。浏览器性能与观感平衡取 4（9x9）。
    const radius = 4;

    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        // 四个象限的偏移范围（与 Python 的 dx/dy 范围对应）
        // 象限1: 左上  象限2: 右上  象限3: 左下  象限4: 右下
        const quads = [
          [-radius, 0, -radius, 0],   // [x0, x1, y0, y1]
          [0, radius, -radius, 0],
          [-radius, 0, 0, radius],
          [0, radius, 0, radius]
        ];

        let bestVar = Infinity;
        let bestR = 0, bestG = 0, bestB = 0;

        for (let q = 0; q < 4; q++) {
          const x0 = quads[q][0], x1 = quads[q][1];
          const y0 = quads[q][2], y1 = quads[q][3];
          let sr = 0, sg = 0, sb = 0;
          let sr2 = 0, sg2 = 0, sb2 = 0;
          let count = 0;

          for (let dy = y0; dy <= y1; dy++) {
            const py = y + dy;
            if (py < 0 || py >= h) continue;
            for (let dx = x0; dx <= x1; dx++) {
              const px = x + dx;
              if (px < 0 || px >= w) continue;
              const idx = (py * w + px) * 4;
              const r = data[idx], g = data[idx + 1], b = data[idx + 2];
              sr += r; sg += g; sb += b;
              sr2 += r * r; sg2 += g * g; sb2 += b * b;
              count++;
            }
          }

          if (count === 0) continue;

          // 三通道方差之和（等价于把 RGB 当独立维度统计总方差）
          const mr = sr / count, mg = sg / count, mb = sb / count;
          const vr = sr2 / count - mr * mr;
          const vg = sg2 / count - mg * mg;
          const vb = sb2 / count - mb * mb;
          const variance = vr + vg + vb;

          if (variance < bestVar) {
            bestVar = variance;
            bestR = mr; bestG = mg; bestB = mb;
          }
        }

        const outIdx = (y * w + x) * 4;
        output[outIdx]     = bestR;
        output[outIdx + 1] = bestG;
        output[outIdx + 2] = bestB;
        output[outIdx + 3] = 255;
      }
    }

    // 轻微噪声，模拟颜料颗粒
    for (let i = 0; i < output.length; i += 4) {
      const noise = (Math.random() - 0.5) * 18;
      data[i]     = output[i]     + noise;
      data[i + 1] = output[i + 1] + noise;
      data[i + 2] = output[i + 2] + noise;
      data[i + 3] = 255;
    }

    ctx.putImageData(imgData, 0, 0);
  }

  function applySketch(imgData) {
    const data = imgData.data, w = canvas.width, h = canvas.height;
    const grayscale = new Uint8ClampedArray(data.length / 4);
    for (let i = 0; i < data.length; i += 4) grayscale[i / 4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        const gx = -1 * grayscale[idx - w - 1] + 1 * grayscale[idx - w + 1] + -2 * grayscale[idx - 1] + 2 * grayscale[idx + 1] + -1 * grayscale[idx + w - 1] + 1 * grayscale[idx + w + 1];
        const gy = -1 * grayscale[idx - w - 1] - 2 * grayscale[idx - w] - 1 * grayscale[idx - w + 1] + 1 * grayscale[idx + w - 1] + 2 * grayscale[idx + w] + 1 * grayscale[idx + w + 1];
        const mag = Math.sqrt(gx * gx + gy * gy);
        let val = Math.max(0, Math.min(255, 255 - mag * 2));
        const p = idx * 4; data[p] = val; data[p+1] = val; data[p+2] = val; data[p+3] = 255;
      }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function applyCelShading(imgData) {
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      let r = Math.round(data[i] / 64) * 64, g = Math.round(data[i+1] / 64) * 64, b = Math.round(data[i+2] / 64) * 64;
      data[i] = Math.min(255, Math.max(0, (r - 128) * 1.4 + 128));
      data[i+1] = Math.min(255, Math.max(0, (g - 128) * 1.4 + 128));
      data[i+2] = Math.min(255, Math.max(0, (b - 128) * 1.4 + 128));
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function applyAnime(imgData) {
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      let r = data[i], g = data[i+1], b = data[i+2], avg = (r + g + b) / 3;
      data[i] = Math.min(255, Math.max(0, r + (r - avg) * 0.4 * 1.1 + 10));
      data[i+1] = Math.min(255, Math.max(0, g + (g - avg) * 0.4 * 1.1 + 10));
      data[i+2] = Math.min(255, Math.max(0, b + (b - avg) * 0.4 * 1.1 + 10));
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function applyInkWash(imgData) {
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      let gray = (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2] - 128) * 1.5 + 128;
      data[i] = Math.min(255, Math.max(0, (gray / 255) * 245));
      data[i+1] = Math.min(255, Math.max(0, (gray / 255) * 240));
      data[i+2] = Math.min(255, Math.max(0, (gray / 255) * 232));
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function applyUkiyoe(imgData) {
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      let gray = Math.round((0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]) / 51) * 51;
      data[i] = Math.min(255, gray * 1.1 + 20); data[i+1] = Math.min(255, gray * 0.9 + 10); data[i+2] = Math.min(255, gray * 1.2);      
    }
    ctx.putImageData(imgData, 0, 0);
  }

  function applyComic(imgData) {
    const data = imgData.data;
    for (let i = 0; i < data.length; i += 4) {
      let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
      data[i] = data[i+1] = data[i+2] = gray > 128 ? 255 : 0; 
      if (gray > 128) { data[i+2] = 0; }
    }
    ctx.putImageData(imgData, 0, 0);
  }

  copyBtn.addEventListener('click', async () => {
    if (!originalImage.src) return;
    try {
      canvas.toBlob(async (blob) => {
        if (!blob) throw new Error("Canvas to Blob failed");
        try {
          const item = new ClipboardItem({ "image/png": blob });
          await navigator.clipboard.write([item]);
          showToast("✅ 图片已复制，可直接粘贴！");
        } catch (err) {
          showToast("❌ 不支持直接复制，已自动下载");
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
                   a.download = `转绘_${currentFilter}_${Date.now()}.png`;
          a.click();
          URL.revokeObjectURL(url);
        }
      }, 'image/png');
    } catch (err) {
      showToast("复制失败，请重试");
    }
  });

  // 全局提示函数
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => {
      toast.classList.remove('show');
    }, 2000);
  }
</script>
